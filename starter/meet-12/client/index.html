<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order — Gin API</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0 auto; padding: 32px 16px; max-width: 960px; font: 16px/1.5 system-ui, sans-serif; color: #172a3a; background: #f3f6fa; }
    section { background: white; border: 1px solid #dbe2ea; border-radius: 12px; padding: 20px; margin: 20px 0; }
    h1, h2 { margin-top: 0; }
    label { display: block; margin: 12px 0; }
    input, button { font: inherit; padding: 10px; border: 1px solid #a8b5c4; border-radius: 6px; }
    input { width: 100%; }
    button { cursor: pointer; background: #174ea6; color: white; margin: 4px 0; }
    button:disabled { opacity: .6; cursor: wait; }
    .item { display: grid; grid-template-columns: 1fr 1fr auto; align-items: end; gap: 12px; }
    .item button { margin-bottom: 12px; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 10px; border-bottom: 1px solid #dbe2ea; }
    #status { min-height: 24px; white-space: pre-wrap; }
    #status[data-error="true"] { color: #ac162c; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 480px) { .item { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <h1>Order</h1>
  <p>Login menggunakan akun API yang sudah terdaftar. Gunakan ID produk yang tersedia.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <section>
    <h2>Login</h2>
    <form id="login">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button>Login</button>
      <button id="logout" type="button">Keluar</button>
    </form>
  </section>
  <section>
    <h2>Buat order</h2>
    <form id="create">
      <div id="items"></div>
      <button id="add" type="button">Tambah produk</button>
      <button>Kirim order</button>
    </form>
  </section>
  <section>
    <h2>Daftar order</h2>
    <button id="refresh" type="button">Muat order</button>
    <div class="scroll">
      <table>
        <thead><tr><th>ID</th><th>Tanggal</th><th>Total</th><th>Detail</th></tr></thead>
        <tbody id="orders"><tr><td colspan="4">Login lalu muat order.</td></tr></tbody>
      </table>
    </div>
  </section>
  <section>
    <h2>Detail order</h2>
    <pre id="detail">Pilih order dari daftar.</pre>
  </section>
  <template id="item-template">
    <div class="item">
      <label>ID produk<input name="product_id" type="number" min="1" step="1" required></label>
      <label>Jumlah<input name="quantity" type="number" min="1" step="1" value="1" required></label>
      <button type="button">Hapus</button>
    </div>
  </template>
  <script>
    const $ = (id) => document.getElementById(id);
    const API_URL = 'http://localhost:8080';
    let token = ''; // Token hanya di memori; muat ulang halaman memerlukan login lagi.
    const rupiah = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' });

    function status(message, error = false) {
      $('status').textContent = message;
      $('status').dataset.error = String(error);
    }

    async function request(path, body) {
      const headers = {};
      if (token) headers.Authorization = `Bearer ${token}`;
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const response = await fetch(`${API_URL}${path}`, {
        method: body === undefined ? 'GET' : 'POST', headers,
        body: body === undefined ? undefined : JSON.stringify(body),
        signal: AbortSignal.timeout(15000)
      });
      const result = await response.json();
      if (!response.ok) {
        if (response.status === 401) token = '';
        throw new Error(result.error || `HTTP ${response.status}`);
      }
      return result.data;
    }

    async function run(button, action) {
      button.disabled = true;
      status('Memproses…');
      try { await action(); }
      catch (error) { status(error.message, true); }
      finally { button.disabled = false; }
    }

    function addItem() {
      const row = $('item-template').content.cloneNode(true);
      row.querySelector('button').onclick = (event) => {
        if ($('items').children.length > 1) event.target.closest('.item').remove();
      };
      $('items').append(row);
    }

    function readItems() {
      const items = Array.from($('items').children, (row) => ({
        product_id: Number(row.querySelector('[name="product_id"]').value),
        quantity: Number(row.querySelector('[name="quantity"]').value)
      }));
      if (!items.length || items.some((item) =>
        !Number.isSafeInteger(item.product_id) || item.product_id < 1 ||
        !Number.isSafeInteger(item.quantity) || item.quantity < 1)) {
        throw new Error('ID produk dan jumlah wajib bilangan bulat positif.');
      }
      if (new Set(items.map((item) => item.product_id)).size !== items.length) {
        throw new Error('ID produk tidak boleh duplikat.');
      }
      return items;
    }

    async function loadOrders() {
      const orders = await request('/api/private/orders');
      $('orders').replaceChildren();
      for (const order of orders || []) {
        const row = document.createElement('tr');
        for (const value of [order.id, new Date(order.created_at).toLocaleString('id-ID'), rupiah.format(order.grand_total)]) {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.append(cell);
        }
        const cell = document.createElement('td');
        const button = document.createElement('button');
        button.textContent = 'Lihat';
        button.onclick = () => run(button, async () => {
          const detail = await request(`/api/private/orders/${encodeURIComponent(order.id)}`);
          $('detail').textContent = JSON.stringify(detail, null, 2);
          status(`Detail order #${detail.id} dimuat.`);
        });
        cell.append(button);
        row.append(cell);
        $('orders').append(row);
      }
      status(orders?.length ? `${orders.length} order dimuat.` : 'Belum ada order.');
    }

    $('login').onsubmit = (event) => {
      event.preventDefault();
      run(event.submitter, async () => {
        const form = new FormData(event.target);
        const data = await request('/api/auth/login', { email: form.get('email'), password: form.get('password') });
        token = data.access_token;
        event.target.reset();
        await loadOrders();
      });
    };
    $('logout').onclick = () => {
      token = '';
      $('orders').replaceChildren();
      $('detail').textContent = 'Pilih order dari daftar.';
      status('Sudah keluar.');
    };
    $('create').onsubmit = (event) => {
      event.preventDefault();
      run(event.submitter, async () => {
        if (!token) throw new Error('Login terlebih dahulu.');
        const order = await request('/api/private/orders', { items: readItems() });
        $('detail').textContent = JSON.stringify(order, null, 2);
        $('items').replaceChildren();
        addItem();
        status(`Order #${order.id} berhasil dibuat. Klik Muat order untuk memperbarui daftar.`);
      });
    };
    $('add').onclick = addItem;
    $('refresh').onclick = () => run($('refresh'), loadOrders);
    addItem();
  </script>
</body>
</html>
